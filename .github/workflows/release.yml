name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push tags, create GitHub releases, commit version bumps
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          # No registry-url: it writes an .npmrc with a placeholder NODE_AUTH_TOKEN that shadows OIDC.
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # Pending changesets: open or update the Version Packages PR. Nothing is published here.
      - id: changesets
        uses: changesets/action@v2.1.2 # no moving v2 tag; the v2 branch is the dev head
      # No pending changesets: publish with the npm CLI. Auth comes from npm trusted publishing
      # (OIDC via id-token), so no NPM_TOKEN secret is needed.
      - if: steps.changesets.outputs.has-changesets == 'false'
        run: npm --version && pnpm release
        env:
          GH_TOKEN: ${{ github.token }}
