name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # Dependabot PRs that pass verify are merged and released without a human.
  # Exception: major updates of runtime dependencies wait for review.
  dependabot:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the changeset, merge
      pull-requests: write # merge
      actions: write # start the release workflow
    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3.1.0

      - id: runtime
        name: Does this change what users install?
        run: |
          if [ "${{ steps.meta.outputs.package-ecosystem }}" = "npm_and_yarn" ] && [ "${{ steps.meta.outputs.dependency-type }}" = "direct:production" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.runtime.outputs.yes == 'true' && steps.meta.outputs.update-type == 'version-update:semver-major'
        name: Leave major runtime updates for review
        run: |
          gh pr comment "$PR_URL" --body "Major update of a runtime dependency, so it isn't merged automatically. Review and merge by hand."

      - if: steps.runtime.outputs.yes == 'true' && steps.meta.outputs.update-type != 'version-update:semver-major'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      # A patch changeset makes the release workflow publish the update (see release.yml).
      - if: steps.runtime.outputs.yes == 'true' && steps.meta.outputs.update-type != 'version-update:semver-major'
        name: Add a changeset
        run: |
          name=$(jq -r .name package.json)
          file=".changeset/dependabot-${{ github.event.pull_request.number }}.md"
          printf -- '---\n"%s": patch\n---\n\nUpdate dependencies: %s.\n' "$name" "${{ steps.meta.outputs.dependency-names }}" > "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "Add changeset for ${{ steps.meta.outputs.dependency-names }}"
          git push

      - if: steps.runtime.outputs.yes != 'true' || steps.meta.outputs.update-type != 'version-update:semver-major'
        name: Merge and release
        run: |
          gh pr merge --squash "$PR_URL"
          # Merges made with this token don't trigger workflows, so start the release explicitly.
          gh workflow run release.yml --ref main --repo "${{ github.repository }}"

  # A Dependabot PR that fails verify gets an issue, so the broken update isn't missed.
  dependabot-failed:
    needs: verify
    if: failure() && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Dependency update failed: ${{ github.event.pull_request.title }}"
    steps:
      - name: Open an issue (once per update)
        run: |
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --label dependencies \
              --body "CI failed on ${{ github.event.pull_request.html_url }}, so it wasn't merged. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || gh issue create --repo "${{ github.repository }}" --title "$TITLE" \
              --body "CI failed on ${{ github.event.pull_request.html_url }}, so it wasn't merged. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

  # CI failing on main (a merge or push broke it): open an issue once while it's unresolved.
  main-failed:
    needs: verify
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: CI is failing on main
    steps:
      - name: Open an issue
        run: |
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" \
              --body "pnpm verify failed at ${{ github.sha }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
